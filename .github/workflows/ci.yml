---
name: CNET CI

'on':
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev pkg-config python3-yaml
      - name: Run portable CPU release gate
        run: make --no-print-directory PORTABLE=1 ci
