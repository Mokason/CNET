# Overnight / default — Bonsai-focused CORE growth
# Copy to $CNET_CORE_BUS_BRICKS_DIR/evolve_direction.conf to customize.

allow_live_miss=1
allow_factory=1
allow_goals=1
allow_agi_tick=1
factory_if_empty=1
max_new_per_tick=2

prefer_domains=
deny_domains=junk,tmp,test_drop

# Bonsai-8B GGUF tensors (host model; marketed as small Bonsai family)
factory=q1_add16,0,blk.0.attn_q.weight
factory=q1_xor16,1,blk.0.attn_k.weight

allow_obsidian=0
obsidian_max_files=100
# obsidian_vault=/home/marble/Obsidian

# Grok guide stays env-gated (CNET_GROK_GUIDE=1); off for bonsai-only overnight
