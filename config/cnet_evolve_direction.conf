# CNET evolve direction — steer unattended growth
# Path: $CNET_CORE_BUS_BRICKS_DIR/evolve_direction.conf
#   or: config/cnet_evolve_direction.conf
#   or: $CNET_EVOLVE_DIRECTION
#
# CORE only evolves along this curriculum + live taught tables.
# Still: TABLE≥0.95 before admit; never residual auto-CERT; no parrot mouth.

# --- switches (0/1) ---
allow_live_miss=1
allow_factory=1
allow_goals=1
allow_agi_tick=1
factory_if_empty=1

# Max new bricks admitted/built per evolve tick (safety)
max_new_per_tick=3

# Only admit live-miss domains in this list (comma). Empty = any complete domain.
prefer_domains=

# Never admit these domains (comma)
deny_domains=junk,tmp,test_drop

# Factory curriculum: tag,mode,tensor
# mode: 0=add-bit LUT  1=xor-bit LUT
factory=q1_add16,0,blk.0.attn_q.weight
factory=q1_xor16,1,blk.0.attn_k.weight
# factory=q1_add16v,0,blk.0.attn_v.weight
# factory=q1_xor16g,1,blk.0.ffn_gate.weight

# Optional seed goals each tick (CERT-only language; chat/roleplay rejected)
# goal=prove q1_add16 at 3
# goal=prove q1_xor16 at 2
