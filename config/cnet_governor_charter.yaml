# CNET self-direction charter (human-owned).
# Governor may ONLY pursue listed goals. Pins can freeze/force.

version: 2
max_tasks_per_cycle: 3
budget_sec: 900

goals:
  - id: keep_teacher_alive
    priority: 0
    description: Bonsai HTTP teacher and lane must be up
    when: "bonsai_ok == 0 or lane_ok == 0"
    actions: [ensure_bonsai, ensure_lane]

  - id: drain_open_gaps
    priority: 1
    description: Teachable backlog / waiting_oracle
    when: "open_gaps + deferred_oracle >= 8 or backlog_pressure >= 8 or real_miss_rate >= 0.15"
    actions: [ensure_lane, inject_window_gaps, nudge_lane_tick]

  - id: peft_jtc
    priority: 2
    description: JTC PEFT when faults warm and heavy allowed
    when: "fault_lines >= 64 and allow_heavy == 1 and (hours_since_peft >= 0.5 or plateau == 1 or eval_jtc_delta < 0.35)"
    actions: [run_cert_learn, run_eval_probe]

  - id: structure_mine
    priority: 3
    description: Residual → certified A
    when: "bonsai_ok == 1 and allow_heavy == 1 and (hours_since_mine >= 1.5 or (plateau == 1 and hours_since_mine >= 0.4))"
    actions: [run_structure_mine]

  - id: procedure_curriculum
    priority: 4
    description: Procedure / research skill pulse
    when: "hours_since_procedure >= 3"
    actions: [seed_procedures, queue_research]

  - id: verified_web
    priority: 4
    description: Explore one allowlisted page into web_notes
    when: "pause_web == 0 and web_notes < 50 and (hours_since_web >= 0.4 or project_web == 1)"
    actions: [safe_web]

  - id: coverage_curiosity
    priority: 5
    description: Window coverage when healthy idle
    when: "bonsai_ok == 1 and lane_ok == 1 and backlog_pressure < 8 and plateau == 0 and busy == 0"
    actions: [inject_window_gaps, ensure_curiosity]

  - id: break_plateau
    priority: 2
    description: Stalled learning — PEFT + mine + inject (heavy)
    when: "plateau == 1 and teacher_uptime >= 0.5 and allow_heavy == 1"
    actions: [run_cert_learn, run_structure_mine, inject_window_gaps, run_eval_probe]

  - id: outcome_review
    priority: 3
    description: Close the loop on last cycle outcomes
    when: "pending_outcome == 1"
    actions: [close_outcome, run_eval_probe]

  - id: health_hold
    priority: 9
    description: Nothing urgent
    when: "true"
    actions: [log_hold]
